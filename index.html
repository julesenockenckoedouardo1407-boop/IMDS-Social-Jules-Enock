<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b5e20">
<meta name="description" content="IMDS Social Jules Enock v2.0">
<link rel="manifest" href="manifest.json">
<title>IMDS Social Jules Enock v2.0</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">IMDS</div>
      <div><strong>IMDS Social</strong><small>Jules Enock v2.0</small></div>
    </div>
    <button id="logoutBtn" class="ghost hidden">Déconnexion</button>
  </header>

  <main>
    <section id="authView" class="view">
      <div class="hero">
        <h1>Bienvenue</h1>
        <p>Institution Mixte Le Domaine du Savoir</p>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="login">Connexion</button>
        <button class="tab" data-tab="register">Inscription</button>
      </div>

      <form id="loginForm" class="card form">
        <label>Téléphone ou e-mail<input id="loginId" required autocomplete="username"></label>
        <label>Mot de passe<input id="loginPassword" type="password" required autocomplete="current-password"></label>
        <button class="primary">Se connecter</button>
        <button type="button" id="demoBtn" class="secondary">Mode démonstration</button>
      </form>

      <form id="registerForm" class="card form hidden">
        <label>Nom et prénom<input id="regName" required></label>
        <label>Téléphone<input id="regPhone" required></label>
        <label>E-mail<input id="regEmail" type="email"></label>
        <label>Mot de passe<input id="regPassword" type="password" minlength="4" required></label>
        <label>Rôle
          <select id="regRole">
            <option value="parent">Parent</option>
            <option value="eleve">Élève</option>
            <option value="professeur">Professeur</option>
            <option value="direction">Direction</option>
          </select>
        </label>
        <button class="primary">Créer mon compte</button>
      </form>

      <p id="authMsg" class="msg"></p>
    </section>

    <section id="dashboardView" class="view hidden">
      <div class="welcome card">
        <div>
          <span class="eyebrow">TABLEAU DE BORD</span>
          <h2 id="welcomeName">Bienvenue</h2>
          <p id="roleLabel"></p>
        </div>
        <div id="roleBadge" class="badge"></div>
      </div>

      <div class="grid">
        <button class="tile" data-module="profil">👤<b>Mon profil</b><small>Informations du compte</small></button>
        <button class="tile" data-module="publications">📢<b>Publications</b><small>À venir</small></button>
        <button class="tile" data-module="classes">📚<b>Classes</b><small>À venir</small></button>
        <button class="tile" data-module="messages">💬<b>Messages</b><small>À venir</small></button>
        <button class="tile" data-module="notifications">🔔<b>Notifications</b><small>À venir</small></button>
        <button class="tile" data-module="sauvegarde">💾<b>Sauvegarde</b><small>Données locales</small></button>
      </div>

      <div id="content" class="card content">
        <h3>IMDS Social v2.0</h3>
        <p>Le cœur du système est prêt. Les modules en ligne seront ajoutés progressivement.</p>
      </div>
    </section>
  </main>

  <footer>Institution Mixte Le Domaine du Savoir — IMDS</footer>
</div>
<script src="app.js"></script>
</body>
</html>
